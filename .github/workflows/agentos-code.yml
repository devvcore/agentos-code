name: OmniCode
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build for the Linux download
        required: true
        default: '0.2.0'
        type: string
  push:
    branches: [codex/agentos-code]
  pull_request:
    paths:
      - 'packages/opencode/**'
      - 'packages/core/src/global.ts'
      - 'packages/tui/**'
      - 'script/install-agentos.sh'
      - '.github/workflows/agentos-code.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test test/agentos test/mcp/catalog.test.ts test/session/retry.test.ts
        if: github.event_name != 'workflow_dispatch'
        working-directory: packages/opencode
      - run: bun run typecheck
        if: github.event_name != 'workflow_dispatch'
        working-directory: packages/opencode
      - run: bun run typecheck
        if: github.event_name != 'workflow_dispatch'
        working-directory: packages/core
      - run: bun run typecheck
        if: github.event_name != 'workflow_dispatch'
        working-directory: packages/tui
      - run: bun run script/build.ts --agentos --single --skip-install --skip-embed-web-ui
        working-directory: packages/opencode
        env:
          OPENCODE_CHANNEL: agentos
          OPENCODE_VERSION: ${{ inputs.version || '0.2.0' }}
      - name: Verify the Linux download starts
        run: |
          ./dist/agentos-code-linux-x64/bin/agentos-code --version
          ./dist/agentos-code-linux-x64/bin/agentos-code --help
        working-directory: packages/opencode
      - uses: actions/upload-artifact@v4
        with:
          name: agentos-code-linux-x64
          path: packages/opencode/dist/agentos-code-linux-x64/bin/agentos-code
          retention-days: 14
