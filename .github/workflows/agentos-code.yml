name: AgentOS Code
on:
  push:
    branches: [codex/agentos-code]
  pull_request:
    paths:
      - 'packages/opencode/**'
      - 'packages/core/src/global.ts'
      - 'packages/tui/**'
      - 'script/install-agentos.sh'
      - '.github/workflows/agentos-code.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test test/agentos test/session/retry.test.ts
        working-directory: packages/opencode
      - run: bun run typecheck
        working-directory: packages/opencode
      - run: bun run typecheck
        working-directory: packages/core
      - run: bun run typecheck
        working-directory: packages/tui
      - run: bun run script/build.ts --agentos --single --skip-install --skip-embed-web-ui
        working-directory: packages/opencode
        env:
          OPENCODE_CHANNEL: agentos
          OPENCODE_VERSION: 0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: agentos-code-linux-x64
          path: packages/opencode/dist/agentos-code-linux-x64/bin/agentos-code
          retention-days: 14
